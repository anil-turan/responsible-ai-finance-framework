[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "responsible-ai-finance"
version = "0.1.0"
description = "Fairness, explainability and robustness audit framework for ML models in financial services"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anil Turan" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "shap>=0.45",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/anil-turan/responsible-ai-finance-framework"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "lightgbm>=4.0", "jupyter>=1.0", "nbconvert>=7.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
